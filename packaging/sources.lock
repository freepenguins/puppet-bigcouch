# Sources for the packages built by build.sh, pinned by SHA-256 (tarballs)
# or by commit (git). fetch.sh downloads them into the cache and checks them.
#
# tar  <name> <url> <sha256>
# git  <name> <url> <ref> <commit>
#
# Where a project publishes checksums or signatures, the pin was checked
# against them: OpenSSL's .sha256 file. Mozilla publishes no
# checksum for js185-1.0.0.tar.gz; its MD5 is a4574365938222adca0a6bd33329cb32.

tar js185-1.0.0.tar.gz            https://ftp.mozilla.org/pub/js/js185-1.0.0.tar.gz                                                      5d12f7e1f5b4a99436685d97b9b7b75f094d33580227aa998c406bbae6f2a687
tar openssl-1.0.2u.tar.gz         https://github.com/openssl/openssl/releases/download/OpenSSL_1_0_2u/openssl-1.0.2u.tar.gz              ecd0c6ffb493dd06707d38b14bb4d8c2288bb7033735606569d8f90f89669d16

